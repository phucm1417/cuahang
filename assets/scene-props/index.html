<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bộ vật dụng Tiệm Nhỏ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; color: #463d31; background: #f6f1e5; font: 15px/1.45 system-ui, sans-serif; }
    main { width: min(1040px, 100%); margin: auto; }
    h1 { margin: 0 0 5px; font-size: 28px; }
    p { margin: 0 0 24px; color: #817765; }
    h2 { margin: 26px 0 12px; font-size: 19px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
    figure { display: grid; min-height: 154px; margin: 0; padding: 12px; place-items: center; border: 1px solid #e4dac5; border-radius: 18px; background: #fffdf6; box-shadow: 0 5px 16px #5e492318; }
    img { width: 100%; height: 112px; object-fit: contain; }
    figcaption { align-self: end; color: #70624c; font-size: 12px; font-weight: 750; text-align: center; }
    @media(max-width:480px) { body { padding: 16px; } .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body><main>
  <h1>Bộ vật dụng Tiệm Nhỏ</h1>
  <p>SVG trong suốt, vẽ cùng bảng màu gỗ ấm và xanh sage của bàn ăn và bếp nấu. Các vật dụng đã được đặt sẵn trong game ở cả bản đồ ngang lẫn màn hình dọc.</p>
  <h2>Sảnh chính</h2><section class="grid">
    <figure><img src="foyer-rug.svg" alt="Thảm sảnh"/><figcaption>Thảm sảnh</figcaption></figure>
    <figure><img src="wall-window.svg" alt="Cửa sổ gỗ"/><figcaption>Cửa sổ</figcaption></figure>
    <figure><img src="hall-service-desk.svg" alt="Quầy thu ngân"/><figcaption>Quầy thu ngân</figcaption></figure>
    <figure><img src="tip-jar.svg" alt="Hũ tiền tip"/><figcaption>Hũ tiền tip</figcaption></figure>
    <figure><img src="tea-table.svg" alt="Bàn trà"/><figcaption>Bàn trà</figcaption></figure>
    <figure><img src="entry-planter.svg" alt="Chậu cây"/><figcaption>Chậu cây cửa vào</figcaption></figure>
  </section>
  <h2>Khu bếp</h2><section class="grid">
    <figure><img src="kitchen-refrigerator.svg" alt="Tủ lạnh"/><figcaption>Tủ lạnh</figcaption></figure>
    <figure><img src="kitchen-wall-cabinet.svg" alt="Tủ bếp"/><figcaption>Tủ bếp</figcaption></figure>
    <figure><img src="kitchen-ingredient-shelf.svg" alt="Kệ nguyên liệu"/><figcaption>Kệ nguyên liệu</figcaption></figure>
    <figure><img src="kitchen-waste-bin.svg" alt="Thùng rác"/><figcaption>Thùng rác</figcaption></figure>
    <figure><img src="kitchen-hanging-rack.svg" alt="Giá treo dụng cụ"/><figcaption>Giá treo đồ bếp</figcaption></figure>
    <figure><img src="kitchen-window.svg" alt="Cửa sổ bếp"/><figcaption>Cửa sổ bếp</figcaption></figure>
    <figure><img src="kitchen-prep-sink.svg" alt="Bồn sơ chế"/><figcaption>Bàn sơ chế và bồn rửa</figcaption></figure>
  </section>
</main></body></html>
